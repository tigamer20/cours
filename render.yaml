# Blueprint Render : https://render.com/docs/blueprint-spec
# Dashboard Render → New → Blueprint → choisir ce dépôt. Voir README.md, section « Déploiement sur Render ».
# Plan gratuit : le disque est effacé à chaque mise en veille / redéploiement, donc TOUTES les données
# (comptes, notes, fichiers…) sont stockées dans la base en ligne Turso (gratuite) : DATABASE_URL + DATABASE_TOKEN.
services:
  - type: web
    name: cartable
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: MAX_UPLOAD_MB
        value: "15"
      # Base de données Turso (libsql://….turso.io) et son jeton — Render vous demandera les valeurs.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_TOKEN
        sync: false
      # Premier compte administrateur, créé au premier démarrage (base vide).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
